name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surfsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Intentionally run without DATABASE_URL: this mirrors the Vercel build
      # container, where env vars are runtime-only. The build must never
      # require a database connection (force-dynamic auth route, lazy pool).
      - name: Build
        run: pnpm build

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/surfsync_test

      - name: Seed reference data
        run: pnpm db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/surfsync_test

      - name: Database smoke test
        run: pnpm db:smoke
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/surfsync_test
